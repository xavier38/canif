<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Nieuw in Canif 0.7.62</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; margin: 14px 18px; color: #14213d; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  ul { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
  @media (prefers-color-scheme: dark) { body { color: #e8eefc; background: transparent; } }
</style></head>
<body><h1>Nieuw in Canif 0.7.62</h1><ul>
  <li>Canif verbruikt minder in rust: de puntjes rond de notch worden niet meer 30 keer per seconde getekend, alleen als ze veranderen (ongeveer 20 keer minder keren dat de processor wakker wordt), en de afspeelbalkjes zijn lichter.</li>
</ul></body></html>
