<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><title>Novidades do Canif 1.8.22</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; margin: 14px 18px; color: #14213d; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  ul { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
  @media (prefers-color-scheme: dark) { body { color: #e8eefc; background: transparent; } }
</style></head>
<body><h1>Novidades do Canif 1.8.22</h1><ul>
  <li>Barra de menus: uma notificação de compromisso faz agora piscar também o ícone (alternando com o mosaico de calendário do dia), até a confirmar.</li>
  <li>Notch: nos Mac sem notch físico, o notch simulado é agora três vezes mais baixo e fica no topo da barra de menus.</li>
</ul></body></html>
