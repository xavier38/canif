<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>What's new in Canif 0.7.62</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; margin: 14px 18px; color: #14213d; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  ul { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
  @media (prefers-color-scheme: dark) { body { color: #e8eefc; background: transparent; } }
</style></head>
<body><h1>What's new in Canif 0.7.62</h1><ul>
  <li>Canif uses less when idle: the dots around the notch are no longer redrawn 30 times a second, only when they change (about 20 times fewer processor wake-ups), and the “now playing” bars are lighter.</li>
</ul></body></html>
