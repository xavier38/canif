<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Novedades de Canif 1.9.2</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; margin: 14px 18px; color: #14213d; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  ul { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
  @media (prefers-color-scheme: dark) { body { color: #e8eefc; background: transparent; } }
</style></head>
<body><h1>Novedades de Canif 1.9.2</h1><ul>
  <li>Iconos: el mismo icono en todas partes para un mismo módulo. Red y Dictado mostraban aún el símbolo antiguo en algunos sitios; ahora todo es coherente (el micrófono del dictado sigue poniéndose rojo mientras escucha).</li>
</ul></body></html>
