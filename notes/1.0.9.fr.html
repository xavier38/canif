<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Nouveautés de Canif 1.0.9</title>
<style>
  :root { color-scheme: light dark; }

<body><h1>Nouveautés de Canif 1.0.9</h1><ul>
  <li>Couper-coller : nouveau « Flash à l’écran ». L’écran s’illumine brièvement d’une couleur différente quand vous coupez (rouge), copiez (bleu) ou collez (vert), en bordure ou en plein écran. Les trois couleurs se règlent, avec un bouton pour essayer.</li>
