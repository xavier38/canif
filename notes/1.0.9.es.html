<html lang="es"><head><meta charset="utf-8"><title>Novedades de Canif 1.0.9</title>
<style>
  :root { color-scheme: light dark; }

<body><h1>Novedades de Canif 1.0.9</h1><ul>
  <li>Cortar y pegar: nuevo «Destello en pantalla». La pantalla se ilumina brevemente con un color distinto al cortar (rojo), copiar (azul) o pegar (verde), como borde o a pantalla completa. Los tres colores se pueden cambiar, con un botón para probarlos.</li>
</ul></body></html>
